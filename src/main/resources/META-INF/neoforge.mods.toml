modLoader="javafml"
loaderVersion="[5,)"
license="All Rights Reserved"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="VoidMode"
authors = "vostok41, ZavidVi"
description="VoidMod"

[[dependencies.voidmod]]
    modId="neoforge"
    type="required"
    versionRange="${neoforge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.voidmod]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.voidmod]]
    modId="geckolib"
    type="required"
    versionRange="[${geckolib_version},)"
    ordering="AFTER"
    side="BOTH"

[[mixins]]
config = "voidmod.mixins.json"
